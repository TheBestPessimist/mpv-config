
# hardware decoder
hwdec = yes

# Delay in milliseconds before we start to autorepeat a key
input-ar-delay = 500
# Number of key presses to generate per second on autorepeat
input-ar-rate = 20
# If the current file is the last playlist entry, keep this file (and mpv) open
keep-open = yes
screenshot-directory = ~~desktop/

# Cursor hide in ms
cursor-autohide=500

# Audio language priority
alang=zh,ja,jp,jpn,en,eng

# Subtitle language priority
slang=en,eng

# Video output driver
vo=gpu-next

osd-scale-by-window = no # Scale OSD size by window size
sub-auto = fuzzy # Load all subs containing media filename
border = no

save-position-on-quit = yes
watch-later-options = start,vid,aid,sid

volume-max = 200
# Default volume of the player
volume=100

# 2026-04-08 i disabled this to see if Star Trek DS9 can be successfully seeked backwards. Maybe this is not the issue, or maybe it is `¯\_(ツ)_/¯`
#hr-seek = yes


# osd
osd-duration = 3000
osd-on-seek = no
# osd-level=3 # don't want this. I believe 1 is default and that seems right
# osd-playing-msg = '${filename} - ${media-title}'


prefetch-playlist = yes


# Internet stuff
ytdl-format = bestvideo[height<=1580]+bestaudio/best
# ytdl-raw-options=cookies-from-browser=vivaldi:"C:\all\Vivaldi\User Data\Profile 7"

ytdl-raw-options = 



# Cache
cache = yes
demuxer-max-bytes = 8G
demuxer-max-back-bytes = 4G




log-file = ~~/mmmmmmmmmmmmmmmmmpv.log
